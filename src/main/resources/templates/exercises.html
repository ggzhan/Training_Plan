<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exercises</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Manage Exercises</h1>
            <p class="subtitle">Add or view available drills</p>

            <form action="/exercises" method="post" th:object="${newExercise}" class="exercise-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" th:field="*{name}" required placeholder="e.g., Passing Drill">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Duration (min)</label>
                        <input type="number" th:field="*{durationMinutes}" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <input type="text" th:field="*{type}" required placeholder="e.g., Drill">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Min Players</label>
                        <input type="number" th:field="*{minPlayers}" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Max Players (0 for any)</label>
                        <input type="number" th:field="*{maxPlayers}" required min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" th:field="*{description}" placeholder="Optional description">
                </div>
                <button type="submit" class="btn-primary">Add Exercise</button>
            </form>

            <hr class="divider">

            <ul class="exercise-list">
                <li th:each="exercise : ${exercises}" class="exercise-item">
                    <div class="exercise-info">
                        <h3 th:text="${exercise.name}">Exercise Name</h3>
                        <div class="exercise-meta">
                            <span th:text="${exercise.type}">Type</span> •
                            <span
                                th:text="${exercise.minPlayers} + '-' + ${exercise.maxPlayers == 0 ? 'Any' : exercise.maxPlayers} + ' players'">Players</span>
                        </div>
                    </div>
                    <div class="exercise-duration" th:text="${exercise.durationMinutes} + ' min'">
                        15 min
                    </div>
                </li>
            </ul>

            <a href="/" class="back-link">← Back to Planner</a>
        </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
