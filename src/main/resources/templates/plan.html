<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Training Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="plan-header">
                <div class="plan-stat">
                    <div class="plan-stat-value" th:text="${trainingPlan.totalDuration} + ' min'">0 min</div>
                    <div class="plan-stat-label">Total Time</div>
                </div>
                <div class="plan-stat">
                    <div class="plan-stat-value" th:text="${trainingPlan.playerCount}">0</div>
                    <div class="plan-stat-label">Players</div>
                </div>
            </div>

            <ul class="exercise-list">
                <li class="exercise-item" th:each="exercise : ${trainingPlan.exercises}">
                    <div class="exercise-info">
                        <div class="exercise-name" th:text="${exercise.name}">Exercise Name</div>
                        <div class="exercise-desc" th:text="${exercise.description}">Description</div>
                        <div class="exercise-meta">
                            <span class="exercise-tag" th:text="${exercise.type}">Type</span>
                        </div>

                        <!-- Player Pairs Section -->
                        <div class="player-pairs"
                            th:if="${trainingPlan.exercisePairs.get(exercise) != null and !trainingPlan.exercisePairs.get(exercise).isEmpty()}">
                            <div class="pairs-header">Assigned Pairs:</div>
                            <div class="pairs-list">
                                <span class="pair-item" th:each="pair : ${trainingPlan.exercisePairs.get(exercise)}">
                                    <span th:text="${pair.player1.name}">Player 1</span> & <span
                                        th:text="${pair.player2.name}">Player 2</span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="exercise-duration" th:text="${exercise.durationMinutes} + ' min'">
                        15 min
                    </div>
                </li>
            </ul>

            <a href="/" class="back-link">← Create Another Plan</a>
        </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
