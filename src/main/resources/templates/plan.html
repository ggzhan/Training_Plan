<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trainingsplan</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ccircle cx='16' cy='16' r='14' fill='%233157b8'/%3e%3ccircle cx='21' cy='11' r='4' fill='white'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css(v=11)}">
</head>

<body>
    <header class="topbar topbar-plan">
        <h1 id="planTitle">Trainingsplan</h1>
        <a href="/" class="btn btn-secondary">Neuer Plan</a>
        <p id="planMeta" class="meta"></p>
    </header>

    <nav class="exnav" aria-label="Übungen" id="exnav" hidden>
        <div class="exnav-inner" id="exnavInner"></div>
    </nav>

    <main class="page" style="margin-top: var(--space-4);">
        <div id="emptyState" class="panel" hidden>
            <h2>Noch kein Plan</h2>
            <p class="hint">Auf diesem Gerät ist kein Trainingsplan gespeichert.</p>
            <a href="/" class="btn btn-primary" style="margin-top: var(--space-3);">Plan erstellen</a>
        </div>

        <section id="attendance" class="panel" aria-labelledby="attendanceHeading" hidden>
            <div class="panel-head">
                <h2 id="attendanceHeading"><i class="bi bi-people" aria-hidden="true"></i> Anwesend
                    <span id="presentCount" class="count">0</span></h2>
                <div class="head-actions">
                    <button type="button" id="addKidBtn" class="btn btn-secondary">
                        <i class="bi bi-person-plus" aria-hidden="true"></i> Kind</button>
                    <button type="button" id="toggleAttendance" class="btn btn-quiet" aria-expanded="false"
                        aria-controls="attendanceBody"><i class="bi bi-person-dash" aria-hidden="true"></i> Fehlt</button>
                </div>
            </div>
            <div id="attendanceBody" hidden>
                <p class="info">Wer fehlt? Antippen.</p>
                <div id="attendanceChips" class="chips" role="group" aria-label="Anwesende Kinder"></div>
                <div class="inline" style="margin-top: var(--space-4);">
                    <label for="applyFrom" class="visually-hidden">Neu einteilen ab</label>
                    <select id="applyFrom" class="control"></select>
                    <button type="button" id="applyAttendance" class="btn btn-primary" disabled>Anpassen</button>
                </div>
                <p class="info" id="applyHint"></p>
            </div>
        </section>

        <div id="exercises" class="exercises"></div>
    </main>

    <div class="actionbar" id="actionbar" hidden>
        <div class="actionbar-inner actionbar-wide">
            <div id="viewBar" class="button-row tools">
                <button type="button" id="undoBtn" class="btn btn-secondary" disabled>
                    <i class="bi bi-arrow-90deg-left" aria-hidden="true"></i> Rückgängig</button>
                <button type="button" id="redoBtn" class="btn btn-secondary" disabled>
                    <i class="bi bi-arrow-90deg-right" aria-hidden="true"></i> Wiederholen</button>
                <button type="button" id="pdfBtn" class="btn btn-secondary">
                    <i class="bi bi-file-earmark-arrow-down" aria-hidden="true"></i> PDF</button>
            </div>
            <div id="editBar" hidden>
                <p class="summary" id="editHint"></p>
                <div class="button-row" style="margin-top: var(--space-2);">
                    <button type="button" id="cancelEdit" class="btn btn-secondary">Abbrechen</button>
                    <button type="button" id="saveEdit" class="btn btn-primary">Speichern</button>
                </div>
                <button type="button" id="regenerateBtn" class="btn btn-quiet btn-block btn-wrap" style="margin-top: var(--space-1);">
                    <i class="bi bi-shuffle" aria-hidden="true"></i> <span>Speichern und folgende Übungen neu einteilen</span></button>
            </div>
        </div>
    </div>


    <dialog id="addKidDialog" class="sheet" aria-labelledby="addKidTitle">
        <form method="dialog" id="addKidForm" novalidate>
            <div class="sheet-head">
                <h2 id="addKidTitle"><i class="bi bi-person-plus" aria-hidden="true"></i> Kind kommt dazu</h2>
                <button type="button" class="btn btn-icon btn-quiet" id="closeAddKid" aria-label="Schliessen">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <div class="sheet-body">
                <div class="field">
                    <label for="addKidName" class="field-label">Name</label>
                    <input type="text" id="addKidName" class="control" autocomplete="off" list="addKidKnown">
                    <datalist id="addKidKnown"></datalist>
                </div>
                <div class="inline field">
                    <div style="flex: 1;">
                        <label for="addKidElo" class="field-label">Elo <span class="label-note">höher = stärker</span></label>
                        <input type="number" id="addKidElo" class="control" inputmode="numeric" min="1" max="3000">
                    </div>
                    <div style="flex: 1;">
                        <label for="addKidFrom" class="field-label">Ab</label>
                        <select id="addKidFrom" class="control"></select>
                    </div>
                </div>

                <div class="sub-block">
                    <span class="sub-title" id="addKidStationsTitle"><i class="bi bi-sliders" aria-hidden="true"></i> Ab dann</span>
                    <ul id="addKidBuckets" class="bucket-list" aria-labelledby="addKidStationsTitle"></ul>
                    <button type="button" id="addKidAddBucket" class="btn btn-quiet">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i> Balleimer</button>
                    <div class="stepper-row">
                        <label for="addKidMental"><i class="bi bi-lightbulb" aria-hidden="true"></i> Mentaltrainer</label>
                        <div class="stepper">
                            <button type="button" class="btn" data-kid-step="-1" aria-label="Ein Kind weniger beim Mentaltrainer">−</button>
                            <input type="number" id="addKidMental" inputmode="numeric" min="0" max="8" value="0">
                            <button type="button" class="btn" data-kid-step="1" aria-label="Ein Kind mehr beim Mentaltrainer">+</button>
                        </div>
                    </div>
                    <p id="addKidStats" class="stats" aria-live="polite" style="margin-top: var(--space-3);"></p>
                </div>
                <p id="addKidError" class="notice notice-danger" role="alert" hidden style="margin-top: var(--space-3);"></p>
            </div>
            <div class="sheet-foot">
                <button type="button" class="btn btn-secondary" id="cancelAddKid">Abbrechen</button>
                <button type="submit" class="btn btn-primary" id="confirmAddKid">Hinzufügen</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast-host" role="status" aria-live="polite"></div>

    <script th:src="@{/js/common.js(v=2)}"></script>
    <script th:src="@{/js/plan.js(v=8)}"></script>
</body>

</html>
