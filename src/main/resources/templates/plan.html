<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trainingsplan</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ccircle cx='16' cy='16' r='14' fill='%233157b8'/%3e%3ccircle cx='21' cy='11' r='4' fill='white'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css(v=1)}">
</head>

<body>
    <header class="topbar">
        <div>
            <h1 id="planTitle">Trainingsplan</h1>
            <p id="planMeta" class="meta"></p>
        </div>
        <a href="/" class="btn btn-secondary">Neuer Plan</a>
    </header>

    <nav class="exnav" aria-label="Übungen" id="exnav" hidden>
        <div class="exnav-inner" id="exnavInner"></div>
    </nav>

    <main class="page" style="margin-top: var(--space-4);">
        <div id="emptyState" class="panel" hidden>
            <h2>Noch kein Plan</h2>
            <p class="hint">Auf diesem Gerät ist kein Trainingsplan gespeichert.</p>
            <a href="/" class="btn btn-primary" style="margin-top: var(--space-3);">Plan erstellen</a>
        </div>

        <section id="attendance" class="panel" aria-labelledby="attendanceHeading" hidden>
            <div class="panel-head">
                <h2 id="attendanceHeading">Anwesend <span id="presentCount" class="count">0</span></h2>
                <button type="button" id="toggleAttendance" class="btn btn-quiet" aria-expanded="false"
                    aria-controls="attendanceBody">Anpassen</button>
            </div>
            <div id="attendanceBody" hidden>
                <p class="hint">Fehlt ein Kind oder kommt eines dazu? Antippen, dann den Plan anpassen.</p>
                <div id="attendanceChips" class="chips" role="group" aria-label="Anwesende Kinder"></div>

                <div class="field" style="margin-top: var(--space-4);">
                    <label for="lateName" class="field-label">Kind kommt dazu</label>
                    <div class="inline">
                        <input type="text" id="lateName" class="control" placeholder="Name" autocomplete="off"
                            enterkeyhint="done">
                        <input type="number" id="lateKlassierung" class="control" style="flex: 0 0 5.5rem;"
                            inputmode="numeric" min="1" max="21" value="1" aria-label="Klassierung, 1 bis 21, höher heisst stärker">
                        <button type="button" id="addLateBtn" class="btn btn-secondary">Dazu</button>
                    </div>
                    <p class="hint">Die Zahl ist die Klassierung: 1 bis 21, höher heisst stärker.</p>
                </div>

                <div class="field">
                    <label for="applyFrom" class="field-label">Neu einteilen ab</label>
                    <div class="inline">
                        <select id="applyFrom" class="control"></select>
                        <button type="button" id="applyAttendance" class="btn btn-primary" disabled>Plan anpassen</button>
                    </div>
                    <p class="hint" id="applyHint">Frühere Übungen bleiben, wie sie sind.</p>
                </div>
            </div>
        </section>

        <div id="exercises" class="exercises"></div>
    </main>

    <div class="actionbar" id="actionbar" hidden>
        <div class="actionbar-inner actionbar-wide">
            <div id="viewBar" class="button-row tools">
                <button type="button" id="undoBtn" class="btn btn-secondary" disabled>
                    <i class="bi bi-arrow-90deg-left" aria-hidden="true"></i> Rückgängig</button>
                <button type="button" id="redoBtn" class="btn btn-secondary" disabled>
                    <i class="bi bi-arrow-90deg-right" aria-hidden="true"></i> Wiederholen</button>
                <button type="button" id="pdfBtn" class="btn btn-secondary">
                    <i class="bi bi-file-earmark-arrow-down" aria-hidden="true"></i> PDF</button>
            </div>
            <div id="editBar" hidden>
                <p class="summary" id="editHint"></p>
                <div class="button-row" style="margin-top: var(--space-2);">
                    <button type="button" id="cancelEdit" class="btn btn-secondary">Abbrechen</button>
                    <button type="button" id="saveEdit" class="btn btn-primary">Speichern</button>
                </div>
                <button type="button" id="regenerateBtn" class="btn btn-quiet btn-block btn-wrap" style="margin-top: var(--space-1);">
                    <i class="bi bi-shuffle" aria-hidden="true"></i> <span>Speichern und folgende Übungen neu einteilen</span></button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-host" role="status" aria-live="polite"></div>

    <script th:src="@{/js/common.js(v=1)}"></script>
    <script th:src="@{/js/plan.js(v=2)}"></script>
</body>

</html>
