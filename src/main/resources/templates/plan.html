<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihr Trainingsplan</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gradient-bg {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            border: none;
            color: white;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .card {
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
        }

        .exercise-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .exercise-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .player-select {
            border: 2px solid #667eea;
        }

        /* Collapsible chevron animation */
        .collapse-icon {
            transition: transform 0.3s ease;
        }

        [data-bs-toggle="collapse"]:not(.collapsed) .collapse-icon {
            transform: rotate(180deg);
        }

        .slot-label {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        /* Compact Card Styling */
        .card-header {
            padding: 0.5rem 1rem;
        }

        .card-body {
            padding: 0.75rem;
        }

        h5 {
            font-size: 1.1rem;
        }

        .alert {
            padding: 0.4rem 0.75rem;
            font-size: 0.9rem;
        }

        /* Mobile button spacing */
        @media (max-width: 768px) {

            /* Keep player selects side by side on mobile */
            .player-select {
                font-size: 0.75rem;
                padding: 0.25rem 1.5rem 0.25rem 0.25rem;
            }

            .input-group-sm .form-select {
                font-size: 0.75rem;
                padding: 0.25rem 1.5rem 0.25rem 0.25rem;
            }

            .input-group-text {
                font-size: 0.75rem;
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4 px-4">
        <div class="card mb-4">
            <div class="card-header gradient-bg">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4 class="mb-0 fs-5"><i class="bi bi-clipboard-check"></i> Trainingsplan
                        <span id="planDate" class="opacity-75"></span></h4>
                    <div>
                        <button id="undoBtn" class="btn btn-light btn-sm me-2" onclick="undo()" disabled
                            title="Rückgängig (Ctrl+Z)">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                        <button id="redoBtn" class="btn btn-light btn-sm" onclick="redo()" disabled
                            title="Wiederholen (Ctrl+Y)">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>
                <div class="row text-center g-2">
                    <div class="col-6">
                        <h2 class="h5 mb-0"><i class="bi bi-people-fill"></i> <span id="playerCount">0</span></h2>
                        <small class="opacity-75">Spieler</small>
                    </div>
                    <div class="col-6">
                        <h2 class="h5 mb-0"><i class="bi bi-list-check"></i> <span id="exerciseCount">0</span></h2>
                        <small class="opacity-75">Übungen</small>
                    </div>
                    <div class="col-12">
                        <small id="settingsSummary" class="opacity-75"></small>
                    </div>
                </div>
            </div>

            <div class="card-body bg-light">
                <!-- Exercise cards are rendered by plan.js -->
                <div class="row g-3" id="exercises"></div>

                <!-- Back Link and Export -->
                <div class="mt-4 text-center">
                    <a href="/" class="btn btn-gradient btn-lg me-2">
                        <i class="bi bi-arrow-left-circle"></i> Weiteren Plan erstellen
                    </a>
                    <button id="pdfBtn" onclick="exportPdf()" class="btn btn-outline-primary btn-lg">
                        <i class="bi bi-file-earmark-pdf"></i> PDF Export
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const PLAN = JSON.parse(/*[[${planJson}]]*/ '{}');
    </script>
    <script th:src="@{/js/plan.js(v=1)}"></script>
</body>

</html>
