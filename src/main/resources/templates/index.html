<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trainingsplaner</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3ccircle cx='16' cy='16' r='14' fill='%233157b8'/%3e%3ccircle cx='21' cy='11' r='4' fill='white'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css(v=1)}">
</head>

<body>
    <header class="topbar page-narrow">
        <h1>Trainingsplaner</h1>
        <a href="/plan" id="lastPlanLink" class="btn btn-quiet" hidden>
            <i class="bi bi-clipboard-check" aria-hidden="true"></i> <span>Letzter Plan</span>
        </a>
    </header>

    <form id="planForm" novalidate>
        <main class="page page-narrow">
            <div id="formError" class="notice notice-danger" role="alert" hidden></div>

            <section class="panel">
                <div class="field">
                    <label for="trainingDate" class="field-label">Training</label>
                    <div class="inline">
                        <select id="trainingDate" class="control" required>
                            <option th:each="date : ${trainingDates}" th:value="${date}" th:text="${date}"
                                th:selected="${date == defaultDate}">Datum</option>
                        </select>
                        <button type="button" id="refreshBtn" class="btn btn-secondary btn-icon"
                            aria-label="Anmeldungen neu aus dem Sheet laden" title="Neu aus dem Sheet laden">
                            <i class="bi bi-cloud-download" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </section>

            <section class="panel" aria-labelledby="playersHeading">
                <div class="panel-head">
                    <h2 id="playersHeading">Kinder <span id="playerCount" class="count">0</span></h2>
                    <button type="button" id="togglePlayers" class="btn btn-quiet" aria-expanded="false"
                        aria-controls="playerList">Liste zeigen</button>
                </div>
                <p id="rosterNote" class="hint" hidden>
                    Von Hand angepasst.
                    <button type="button" id="resetRoster" class="btn btn-quiet">Aus dem Sheet neu laden</button>
                </p>

                <div id="playerList" hidden>
                    <div class="sortbar" role="group" aria-label="Sortieren">
                        <span>Sortieren:</span>
                        <button type="button" class="btn" data-sort="name" aria-pressed="true">Name</button>
                        <button type="button" class="btn" data-sort="klassierung" aria-pressed="false">Klassierung</button>
                    </div>
                    <ul id="playerListBody" class="player-list"></ul>
                    <button type="button" id="addPlayerBtn" class="btn btn-secondary btn-block">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i> Kind hinzufügen
                    </button>
                </div>
            </section>

            <section class="panel" aria-labelledby="setupHeading">
                <h2 id="setupHeading">Einteilung</h2>

                <div class="stepper-row">
                    <label for="numberOfExercises">Übungen</label>
                    <div class="stepper">
                        <button type="button" class="btn" data-step="-1" data-for="numberOfExercises"
                            aria-label="Eine Übung weniger">−</button>
                        <input type="number" id="numberOfExercises" inputmode="numeric" min="1" max="12" value="6">
                        <button type="button" class="btn" data-step="1" data-for="numberOfExercises"
                            aria-label="Eine Übung mehr">+</button>
                    </div>
                </div>
                <div class="stepper-row">
                    <label for="balleimerCount">Balleimer</label>
                    <div class="stepper">
                        <button type="button" class="btn" data-step="-1" data-for="balleimerCount"
                            aria-label="Ein Balleimer weniger">−</button>
                        <input type="number" id="balleimerCount" inputmode="numeric" min="0" max="6" value="0">
                        <button type="button" class="btn" data-step="1" data-for="balleimerCount"
                            aria-label="Ein Balleimer mehr">+</button>
                    </div>
                </div>
                <div class="stepper-row">
                    <label for="playersPerBalleimer">Kinder pro Balleimer</label>
                    <div class="stepper">
                        <button type="button" class="btn" data-step="-1" data-for="playersPerBalleimer"
                            aria-label="Ein Kind weniger pro Balleimer">−</button>
                        <input type="number" id="playersPerBalleimer" inputmode="numeric" min="1" max="6" value="2">
                        <button type="button" class="btn" data-step="1" data-for="playersPerBalleimer"
                            aria-label="Ein Kind mehr pro Balleimer">+</button>
                    </div>
                </div>

                <div class="field" style="margin-top: var(--space-4);">
                    <label for="sparringName" class="field-label">Sparringpartner</label>
                    <span class="field-help" id="sparringHelp">Trainer oder Helfer, die pro Übung mit einem Kind
                        spielen.</span>
                    <div class="inline">
                        <input type="text" id="sparringName" class="control" placeholder="Name" autocomplete="off"
                            enterkeyhint="done" aria-describedby="sparringHelp">
                        <button type="button" id="addSparringBtn" class="btn btn-secondary">Hinzufügen</button>
                    </div>
                    <div id="sparringList" class="chips" aria-label="Sparringpartner"></div>
                </div>
            </section>
        </main>

        <div class="actionbar">
            <div class="actionbar-inner">
                <p id="stationSummary" class="summary" aria-live="polite"></p>
                <button type="button" id="fixSuggestion" class="btn btn-secondary btn-wrap" hidden></button>
                <button type="submit" id="generateBtn" class="btn btn-primary btn-lg">Plan erstellen</button>
            </div>
        </div>
    </form>

    <dialog id="playerDialog" class="sheet" aria-labelledby="playerDialogTitle">
        <form method="dialog" id="playerForm">
            <div class="sheet-head">
                <h2 id="playerDialogTitle">Kind hinzufügen</h2>
                <button type="button" class="btn btn-icon btn-quiet" id="closePlayerDialog" aria-label="Schliessen">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <div class="sheet-body">
                <div class="field">
                    <label for="playerName" class="field-label">Name</label>
                    <input type="text" class="control" id="playerName" autocomplete="off" required>
                </div>
                <div class="field">
                    <label for="playerKlassierung" class="field-label">Klassierung</label>
                    <span class="field-help" id="klassierungHelp">1 bis 21, höher heisst stärker.</span>
                    <input type="number" class="control" id="playerKlassierung" inputmode="numeric" min="1"
                        max="21" value="1" aria-describedby="klassierungHelp">
                </div>
                <p id="playerError" class="notice notice-danger" role="alert" hidden style="margin-top: var(--space-4);"></p>
            </div>
            <div class="sheet-foot">
                <button type="button" class="btn btn-secondary" id="cancelPlayer">Abbrechen</button>
                <button type="submit" class="btn btn-primary" id="savePlayerBtn">Speichern</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast-host" role="status" aria-live="polite"></div>

    <script th:src="@{/js/common.js(v=1)}"></script>
    <script th:src="@{/js/index.js(v=2)}"></script>
</body>

</html>
