<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Training Planner</h1>
            <p class="subtitle">Design your perfect training session</p>

            <div th:if="${error}" class="error-message">
                <p th:text="${error}"></p>
            </div>

            <form action="/generate-plan" method="post">
                <div class="form-group">
                    <label for="trainingDate">Training Date</label>
                    <select id="trainingDate" name="trainingDate" required>
                        <option th:each="date : ${trainingDates}" th:value="${date}" th:text="${date}"
                            th:selected="${date == defaultDate}">Date</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="totalTime">Total Duration (Minutes)</label>
                    <input type="number" id="totalTime" name="totalTime" value="90" min="15" required>
                </div>

                <button type="submit" class="btn-primary">Generate Plan</button>
            </form>

            <a href="/exercises" class="back-link" style="margin-top: 1rem;">Manage Exercises</a>
        </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
