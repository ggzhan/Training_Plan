<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stützpunkt Trainingstool</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --primary-dark: #764ba2;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gradient-bg {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            border: none;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .card {
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 10px;
        }

        .table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Collapsible chevron animation */
        .collapse-icon {
            transition: transform 0.3s ease;
        }

        [data-bs-toggle="collapse"]:not(.collapsed) .collapse-icon {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="card">
            <div class="card-header gradient-bg">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="mb-1"><i class="bi bi-calendar-check"></i> Trainingsplaner</h1>
                        <p class="mb-0 opacity-75">Automatisch Trainingseinteilung generieren</p>
                    </div>
                    <button type="button" onclick="refreshData()" id="refreshBtn" class="btn btn-light">
                        <i class="bi bi-arrow-clockwise"></i> Daten aktualisieren
                    </button>
                </div>
            </div>

            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                </div>

                <form id="planForm" action="/generate-plan" method="post">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="trainingDate" class="form-label fw-bold">
                                <i class="bi bi-calendar3"></i> Trainingsdatum
                            </label>
                            <select id="trainingDate" name="trainingDate" class="form-select" required>
                                <option th:each="date : ${trainingDates}" th:value="${date}" th:text="${date}"
                                    th:selected="${date == defaultDate}">Datum</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="numberOfExercises" class="form-label fw-bold">
                                <i class="bi bi-list-ol"></i> Anzahl der Übungen
                            </label>
                            <input type="number" id="numberOfExercises" name="numberOfExercises" class="form-control"
                                min="1" max="10" value="6" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-12">
                            <label for="numberOfUnpairedPlayers" class="form-label fw-bold">
                                <i class="bi bi-person-dash"></i> Anzahl Spieler ohne Partner
                            </label>
                            <input type="number" id="numberOfUnpairedPlayers" name="numberOfUnpairedPlayers"
                                class="form-control" min="0" max="10" value="0" required>
                            <small class="form-text text-muted">Anzahl der Spieler, die pro Übung ohne Partner
                                bleiben</small>
                        </div>
                    </div>

                    <input type="hidden" id="playersJson" name="playersJson">

                    <!-- Player Management Section -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0" data-bs-toggle="collapse" data-bs-target="#playerListCollapse"
                                style="cursor: pointer;">
                                <i class="bi bi-chevron-down collapse-icon me-2"></i>
                                <i class="bi bi-people"></i> Spieler
                                <span class="badge gradient-bg" id="playerCount">0</span>
                            </h5>
                            <button type="button" class="btn btn-gradient btn-sm" data-bs-toggle="modal"
                                data-bs-target="#playerModal" onclick="openAddPlayerModal()">
                                <i class="bi bi-plus-circle"></i> Spieler hinzufügen
                            </button>
                        </div>

                        <div class="collapse show" id="playerListCollapse">
                            <div class="table-container border rounded">
                                <table class="table table-hover mb-0">
                                    <thead class="gradient-bg">
                                        <tr>
                                            <th>Name</th>
                                            <th class="text-center">Klassierung</th>
                                            <th class="text-end">Aktionen</th>
                                        </tr>
                                    </thead>
                                    <tbody id="playerListBody">
                                        <!-- Players populated via JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-gradient btn-lg">
                            <i class="bi bi-play-circle"></i> Trainingsplan generieren
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Player Modal -->
    <div class="modal fade" id="playerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header gradient-bg">
                    <h5 class="modal-title" id="modalTitle">Spieler hinzufügen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="playerName" class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control" id="playerName" placeholder="Spielername eingeben">
                    </div>
                    <div class="mb-3">
                        <label for="playerKlassierung" class="form-label fw-bold">Klassierung (1-21)</label>
                        <input type="number" class="form-control" id="playerKlassierung" min="1" max="21" value="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-gradient" onclick="savePlayer()">
                        <i class="bi bi-check-circle"></i> Speichern
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js(v=6)}"></script>
</body>

</html>
