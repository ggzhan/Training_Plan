<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Training Planner</h1>
            <p class="subtitle">Design your perfect training session</p>

            <div th:if="${error}" class="error-message">
                <p th:text="${error}"></p>
            </div>

            <form id="planForm" action="/generate-plan" method="post">
                <div class="form-group">
                    <label for="trainingDate">Training Date</label>
                    <select id="trainingDate" name="trainingDate" required>
                        <option th:each="date : ${trainingDates}" th:value="${date}" th:text="${date}"
                            th:selected="${date == defaultDate}">Date</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numberOfExercises">Number of Exercises (1-10)</label>
                    <input type="number" id="numberOfExercises" name="numberOfExercises" min="1" max="10" value="6"
                        required>
                </div>

                <!-- Hidden input to store modified player list -->
                <input type="hidden" id="playersJson" name="playersJson">

                <!-- Player Management Section -->
                <div class="player-management">
                    <div class="section-header"
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 0.5rem;">
                        <h3 style="margin: 0; color: white;">Players (<span id="playerCount">0</span>)</h3>
                        <button type="button" id="addPlayerBtn" class="btn-secondary"
                            style="padding: 0.5rem 1rem; font-size: 0.9rem; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">+
                            Add Player</button>
                    </div>

                    <div class="player-list-container"
                        style="max-height: 300px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 0.5rem; margin-bottom: 1.5rem;">
                        <table class="player-table" style="width: 100%; border-collapse: collapse;">
                            <thead
                                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); position: sticky; top: 0;">
                                <tr>
                                    <th
                                        style="padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); color: white; font-weight: 600;">
                                        Name</th>
                                    <th
                                        style="padding: 0.75rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); color: white; font-weight: 600;">
                                        Klassierung</th>
                                    <th
                                        style="padding: 0.75rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.2); color: white; font-weight: 600;">
                                        Actions</th>
                                </tr>
                            </thead>
                            <tbody id="playerListBody">
                                <!-- Players will be populated here via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Generate Plan</button>
            </form>

            <!-- Player Edit Modal -->
            <div id="playerModal"
                style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
                <div
                    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; border-radius: 0.5rem; max-width: 400px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">
                    <h3 id="modalTitle" style="margin-top: 0; color: white;">Add Player</h3>
                    <div style="margin-bottom: 1rem;">
                        <label for="playerName"
                            style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: white;">Name</label>
                        <input type="text" id="playerName"
                            style="width: 100%; padding: 0.5rem; border: 1px solid rgba(255,255,255,0.3); border-radius: 0.375rem; background: rgba(255,255,255,0.15); color: white; font-size: 1rem;">
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label for="playerKlassierung"
                            style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: white;">Klassierung
                            (0-12)</label>
                        <input type="number" id="playerKlassierung" min="0" max="12" value="1"
                            style="width: 100%; padding: 0.5rem; border: 1px solid rgba(255,255,255,0.3); border-radius: 0.375rem; background: rgba(255,255,255,0.15); color: white; font-size: 1rem;">
                    </div>
                    <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                        <button type="button" onclick="closePlayerModal()"
                            style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 0.375rem; cursor: pointer; font-weight: 500;">Cancel</button>
                        <button type="button" onclick="savePlayer()"
                            style="padding: 0.5rem 1rem; background: white; color: #667eea; border: none; border-radius: 0.375rem; cursor: pointer; font-weight: 600;">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/app.js(v=5)}"></script>
</body>

</html>
