<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Training Plan</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gradient-bg {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            border: none;
            color: white;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .card {
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
        }

        .exercise-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .exercise-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .player-select {
            border: 2px solid #667eea;
        }

        .player-select.duplicate {
            border-color: #dc3545;
            background-color: #ffe6e6;
        }

        .player-select.unused {
            border-color: #ffc107;
            background-color: #fff9e6;
        }

        /* Collapsible chevron animation */
        .collapse-icon {
            transition: transform 0.3s ease;
        }

        [data-bs-toggle="collapse"]:not(.collapsed) .collapse-icon {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="card">
            <div class="card-header gradient-bg">
                <div class="row text-center">
                    <div class="col-md-6">
                        <h2 class="display-6 mb-0"><i class="bi bi-people-fill"></i> <span
                                th:text="${trainingPlan.playerCount}">0</span></h2>
                        <p class="mb-0 opacity-75">Players</p>
                    </div>
                    <div class="col-md-6">
                        <h2 class="display-6 mb-0"><i class="bi bi-list-check"></i> <span
                                th:text="${trainingPlan.exercises.size()}">0</span></h2>
                        <p class="mb-0 opacity-75">Exercises</p>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <!-- Exercise List -->
                <div class="row g-4">
                    <div class="col-12" th:each="exercise, exerciseStat : ${trainingPlan.exercises}">
                        <div class="card exercise-card" th:attr="data-exercise-index=${exerciseStat.index}">
                            <div class="card-header gradient-bg">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0 flex-grow-1" data-bs-toggle="collapse"
                                        th:attr="data-bs-target='#exercise' + ${exerciseStat.index}"
                                        style="cursor: pointer;">
                                        <i class="bi bi-chevron-down collapse-icon me-2"></i>
                                        <i class="bi bi-trophy"></i> Exercise <span
                                            th:text="${exerciseStat.count}">1</span>
                                    </h5>
                                    <div>
                                        <button class="btn btn-light btn-sm"
                                            th:attr="data-exercise-index=${exerciseStat.index}"
                                            onclick="toggleEditMode(this)">
                                            <i class="bi bi-pencil"></i> Edit
                                        </button>
                                        <button class="btn btn-warning btn-sm regenerate-btn" style="display: none;"
                                            th:attr="data-exercise-index=${exerciseStat.index},data-is-last=${exerciseStat.last}"
                                            onclick="regenerateRemaining(this)">
                                            <i class="bi bi-arrow-clockwise"></i> Regenerate Remaining
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="collapse show" th:id="'exercise' + ${exerciseStat.index}">
                                <div class="card-body">
                                    <!-- Player Pairs -->
                                    <div
                                        th:if="${trainingPlan.exercisePairs.get(exercise) != null and !trainingPlan.exercisePairs.get(exercise).isEmpty()}">
                                        <h6 class="text-muted mb-3"><i class="bi bi-people"></i> Assigned Pairs:</h6>
                                        <div class="row g-2" th:attr="data-exercise-index=${exerciseStat.index}">
                                            <div class="col-md-6"
                                                th:each="pair, pairStat : ${trainingPlan.exercisePairs.get(exercise)}"
                                                th:attr="data-pair-index=${pairStat.index}">
                                                <!-- View Mode -->
                                                <div class="pair-view alert alert-info mb-0 d-flex align-items-center">
                                                    <i class="bi bi-person-fill me-2"></i>
                                                    <span>
                                                        <strong th:text="${pair.player1.name}">Player 1</strong> &
                                                        <strong th:text="${pair.player2.name}">Player 2</strong>
                                                    </span>
                                                </div>
                                                <!-- Edit Mode -->
                                                <div class="pair-edit" style="display: none;">
                                                    <div class="input-group input-group-sm">
                                                        <select class="form-select player-select player1-select"
                                                            th:attr="data-pair-index=${pairStat.index}">
                                                            <option th:each="player : ${trainingPlan.availablePlayers}"
                                                                th:value="${player.name}" th:text="${player.name}"
                                                                th:selected="${player.name == pair.player1.name}">
                                                            </option>
                                                        </select>
                                                        <span class="input-group-text">&</span>
                                                        <select class="form-select player-select player2-select"
                                                            th:attr="data-pair-index=${pairStat.index}">
                                                            <option th:each="player : ${trainingPlan.availablePlayers}"
                                                                th:value="${player.name}" th:text="${player.name}"
                                                                th:selected="${player.name == pair.player2.name}">
                                                            </option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Unpaired Player -->
                                    <div th:if="${trainingPlan.unpairedPlayers != null and trainingPlan.unpairedPlayers.get(exercise) != null}"
                                        class="mt-3">
                                        <!-- View Mode -->
                                        <div class="unpaired-view alert alert-warning mb-0">
                                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                            <strong>Unpaired:</strong>
                                            <span th:text="${trainingPlan.unpairedPlayers.get(exercise).name}">Player
                                                Name</span>
                                        </div>
                                        <!-- Edit Mode -->
                                        <div class="unpaired-edit" style="display: none;">
                                            <label class="form-label text-warning fw-bold">
                                                <i class="bi bi-exclamation-triangle-fill"></i> Unpaired Player:
                                            </label>
                                            <select class="form-select player-select unpaired-player-select">
                                                <option th:each="player : ${trainingPlan.availablePlayers}"
                                                    th:value="${player.name}" th:text="${player.name}"
                                                    th:selected="${player.name == trainingPlan.unpairedPlayers.get(exercise).name}">
                                                </option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Validation Warnings -->
                                    <div class="validation-warnings mt-3"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Back Link -->
                    <div class="mt-4 text-center">
                        <a href="/" class="btn btn-gradient btn-lg">
                            <i class="bi bi-arrow-left-circle"></i> Create Another Plan
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap 5 JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/app.js(v=9)}"></script>
</body>

</html>
