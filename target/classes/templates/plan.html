<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Training Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="plan-header">
                <div class="plan-stat">
                    <div class="plan-stat-value" th:text="${trainingPlan.playerCount}">0</div>
                    <div class="plan-stat-label">Players</div>
                </div>
                <div class="plan-stat">
                    <div class="plan-stat-value" th:text="${trainingPlan.exercises.size()}">0</div>
                    <div class="plan-stat-label">Exercises</div>
                </div>
            </div>

            <ul class="exercise-list">
                <li class="exercise-item" th:each="exercise, exerciseStat : ${trainingPlan.exercises}"
                    th:attr="data-exercise-index=${exerciseStat.index}">
                    <div class="exercise-info">
                        <div class="exercise-header">
                            <div class="exercise-name">
                                Exercise <span th:text="${exerciseStat.count}">1</span>
                            </div>
                            <button class="btn-edit" th:attr="data-exercise-index=${exerciseStat.index}"
                                onclick="toggleEditMode(this)">
                                ✏️ Edit
                            </button>
                        </div>

                        <!-- Player Pairs Section -->
                        <div class="player-pairs"
                            th:if="${trainingPlan.exercisePairs.get(exercise) != null and !trainingPlan.exercisePairs.get(exercise).isEmpty()}">
                            <div class="pairs-header">Assigned Pairs:</div>
                            <div class="pairs-list" th:attr="data-exercise-index=${exerciseStat.index}">
                                <div class="pair-item"
                                    th:each="pair, pairStat : ${trainingPlan.exercisePairs.get(exercise)}"
                                    th:attr="data-pair-index=${pairStat.index}">
                                    <!-- View Mode -->
                                    <span class="pair-view">
                                        <span class="player-name" th:text="${pair.player1.name}">Player 1</span> &
                                        <span class="player-name" th:text="${pair.player2.name}">Player 2</span>
                                    </span>
                                    <!-- Edit Mode (hidden by default) -->
                                    <span class="pair-edit" style="display: none;">
                                        <select class="player-select player1-select"
                                            th:attr="data-pair-index=${pairStat.index}">
                                            <option th:each="player : ${trainingPlan.availablePlayers}"
                                                th:value="${player.name}" th:text="${player.name}"
                                                th:selected="${player.name == pair.player1.name}">
                                            </option>
                                        </select>
                                        &
                                        <select class="player-select player2-select"
                                            th:attr="data-pair-index=${pairStat.index}">
                                            <option th:each="player : ${trainingPlan.availablePlayers}"
                                                th:value="${player.name}" th:text="${player.name}"
                                                th:selected="${player.name == pair.player2.name}">
                                            </option>
                                        </select>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Unpaired Player for this Exercise -->
                        <div th:if="${trainingPlan.unpairedPlayers != null and trainingPlan.unpairedPlayers.get(exercise) != null}"
                            class="unpaired-section" style="margin-top: 0.75rem;">
                            <!-- View Mode -->
                            <div class="unpaired-view unpaired-warning">
                                <strong>⚠️ Unpaired:</strong>
                                <span class="unpaired-player-name"
                                    th:text="${trainingPlan.unpairedPlayers.get(exercise).name}">Player Name</span>
                            </div>
                            <!-- Edit Mode (hidden by default) -->
                            <div class="unpaired-edit" style="display: none;">
                                <label style="color: #fbbf24; font-weight: 600; display: block; margin-bottom: 0.5rem;">
                                    ⚠️ Unpaired Player:
                                </label>
                                <select class="player-select unpaired-player-select">
                                    <option th:each="player : ${trainingPlan.availablePlayers}"
                                        th:value="${player.name}" th:text="${player.name}"
                                        th:selected="${player.name == trainingPlan.unpairedPlayers.get(exercise).name}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>

            <a href="/" class="back-link">← Create Another Plan</a>
        </div>
    </div>
    <script th:src="@{/js/app.js(v=3)}"></script>
</body>

</html>
